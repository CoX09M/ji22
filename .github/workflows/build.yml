name: Build TWRP ML-JI22

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      # ============================================================
      # CACHE DO SOURCE DO TWRP
      # ============================================================

      - name: Restore TWRP source cache
        uses: actions/cache@v4
        with:
          path: |
            twrp
            ~/.repoconfig
          key: twrp-8.1-ML-JI22-${{ hashFiles('.github/workflows/build.yml') }}
          restore-keys: |
            twrp-8.1-ML-JI22-

      # ============================================================
      # DEPENDÊNCIAS
      # ============================================================

      - name: Install dependencies
        run: |
          sudo apt update

          sudo apt install -y \
            git-core \
            gnupg \
            flex \
            bison \
            build-essential \
            zip \
            curl \
            zlib1g-dev \
            libc6-dev-i386 \
            lib32ncurses5-dev \
            x11proto-core-dev \
            libx11-dev \
            lib32z1-dev \
            libgl1-mesa-dev \
            libxml2-utils \
            xsltproc \
            unzip \
            fontconfig \
            cpio \
            python3 \
            openjdk-8-jdk

      # ============================================================
      # REPO
      # ============================================================

      - name: Install repo
        run: |
          mkdir -p "$HOME/bin"

          if [ ! -f "$HOME/bin/repo" ]; then
            curl -L \
              https://storage.googleapis.com/git-repo-downloads/repo \
              -o "$HOME/bin/repo"

            chmod a+x "$HOME/bin/repo"
          fi

          echo "$HOME/bin" >> "$GITHUB_PATH"

      # ============================================================
      # PREPARAR SOURCE
      # ============================================================

      - name: Initialize or update TWRP source
        run: |
          if [ ! -d "twrp/.repo" ]; then

            echo "TWRP source não encontrado no cache."
            echo "Inicializando pela primeira vez..."

            mkdir -p twrp
            cd twrp

            repo init \
              --depth=1 \
              -u https://github.com/minimal-manifest-twrp/platform_manifest_twrp_omni.git \
              -b twrp-8.1

          else

            echo "TWRP encontrado no cache."
            echo "Pulando repo init."

          fi

          cd twrp

          if [ ! -d ".repo/projects" ]; then
            echo "Cache incompleto. Sincronizando..."
          fi

          repo sync -j4 --force-sync --no-clone-bundle

      # ============================================================
      # DEVICE TREE
      # ============================================================

      - name: Add or update device tree
        run: |
          DEVICE_DIR="twrp/device/multilaser/ML-JI22-M7SQC_Plus"

          if [ ! -d "$DEVICE_DIR/.git" ]; then

            echo "Device tree não encontrado."
            echo "Clonando..."

            mkdir -p twrp/device/multilaser

            git clone \
              -b 'M7SQC_Plus-user-8.1.0-OPM1.171019.026-20210311-release-keys,user/release-keys' \
              https://github.com/twrpdtgen/android_device_multilaser_ML-JI22-M7SQC_Plus.git \
              "$DEVICE_DIR"

          else

            echo "Device tree encontrado no cache."
            echo "Pulando clone."

          fi

      # ============================================================
      # CORRIGIR DEVICE TREE
      # ============================================================

      - name: Fix device tree
        run: |
          cd twrp/device/multilaser/ML-JI22-M7SQC_Plus

          OLD_NAME="omni_ML-JI22-M7SQC_Plus"
          NEW_NAME="omni_ML_JI22_M7SQC_Plus"

          echo "Criando product makefile compatível..."

          if [ ! -f "${NEW_NAME}.mk" ]; then
            cp "${OLD_NAME}.mk" "${NEW_NAME}.mk"
          fi

          echo "Corrigindo nome do produto..."

          grep -RIl \
            "${OLD_NAME}" . \
            | xargs -r sed -i \
            "s/${OLD_NAME}/${NEW_NAME}/g"

          echo
          echo "Verificando nome antigo..."

          if grep -RIn \
            "${OLD_NAME}" .; then

            echo "ERRO: ainda existem referências ao nome antigo."

            exit 1

          else

            echo "OK: nenhuma referência antiga encontrada."

          fi

      # ============================================================
      # CORRIGIR PYTHON LEGADO
      # ============================================================

      - name: Fix legacy Python syntax
        run: |
          cd twrp

          ROOM_SERVICE="vendor/omni/build/tools/roomservice.py"

          if grep -q \
            'except IOError, ES.ParseError:' \
            "$ROOM_SERVICE"; then

            echo "Corrigindo sintaxe Python 2..."

            sed -i \
              's/except IOError, ES.ParseError:/except (IOError, ES.ParseError):/' \
              "$ROOM_SERVICE"

          else

            echo "Sintaxe problemática não encontrada."

          fi

      # ============================================================
      # BUILD
      # ============================================================

      - name: Build TWRP
        run: |
          cd twrp

          export ALLOW_MISSING_DEPENDENCIES=true

          source build/envsetup.sh

          export TARGET_PRODUCT=omni_ML_JI22_M7SQC_Plus
          export TARGET_BUILD_VARIANT=eng
          export TARGET_BUILD_TYPE=release

          echo "======================================"
          echo "TARGET_PRODUCT=$TARGET_PRODUCT"
          echo "TARGET_BUILD_VARIANT=$TARGET_BUILD_VARIANT"
          echo "TARGET_BUILD_TYPE=$TARGET_BUILD_TYPE"
          echo "======================================"

          mka recoveryimage

      # ============================================================
      # VERIFICAR RECOVERY
      # ============================================================

      - name: Check recovery image
        run: |
          RECOVERY="twrp/out/target/product/ML-JI22-M7SQC_Plus/recovery.img"

          echo "Verificando recovery..."

          if [ ! -f "$RECOVERY" ]; then
            echo "ERRO: recovery.img não foi criado."
            exit 1
          fi

          echo
          echo "======================================"
          echo "TWRP GERADO COM SUCESSO"
          echo "======================================"

          ls -lh "$RECOVERY"
          file "$RECOVERY"

      # ============================================================
      # UPLOAD
      # ============================================================

      - name: Upload recovery.img
        uses: actions/upload-artifact@v4
        with:
          name: TWRP-ML-JI22
          path: twrp/out/target/product/ML-JI22-M7SQC_Plus/recovery.img
          if-no-files-found: error