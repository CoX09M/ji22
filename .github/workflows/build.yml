name: Build TWRP ML-JI22

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:

      # ============================================================
      # CHECKOUT
      # ============================================================

      - name: Checkout
        uses: actions/checkout@v4

      # ============================================================
      # CACHE
      # ============================================================

      - name: Restore TWRP cache
        id: twrp-cache
        uses: actions/cache@v4
        with:
          path: |
            twrp
            ~/.repoconfig
          key: twrp-8.1-ML-JI22-v2
          restore-keys: |
            twrp-8.1-ML-JI22-

      # ============================================================
      # DEPENDÊNCIAS
      # ============================================================

      - name: Install dependencies
        run: |
          sudo apt update

          sudo apt install -y \
            git-core \
            gnupg \
            flex \
            bison \
            build-essential \
            zip \
            curl \
            zlib1g-dev \
            libc6-dev-i386 \
            lib32ncurses5-dev \
            x11proto-core-dev \
            libx11-dev \
            lib32z1-dev \
            libgl1-mesa-dev \
            libxml2-utils \
            xsltproc \
            unzip \
            fontconfig \
            cpio \
            openjdk-8-jdk

      # ============================================================
      # PYTHON 2
      # ============================================================

      - name: Install Python 2
        run: |
          cd /tmp

          if [ ! -d "/tmp/pyenv" ]; then
            git clone --depth=1 \
              https://github.com/pyenv/pyenv.git \
              /tmp/pyenv
          fi

          export PYENV_ROOT="/tmp/pyenv"
          export PATH="$PYENV_ROOT/bin:$PATH"

          eval "$(pyenv init -)"

          pyenv install -s 2.7.18
          pyenv global 2.7.18

          echo "$PYENV_ROOT/shims" >> "$GITHUB_PATH"

          echo "======================================"
          echo "PYTHON"
          echo "======================================"

          python --version

      # ============================================================
      # REPO
      # ============================================================

      - name: Install repo
        run: |
          mkdir -p "$HOME/bin"

          if [ ! -f "$HOME/bin/repo" ]; then
            curl -L \
              https://storage.googleapis.com/git-repo-downloads/repo \
              -o "$HOME/bin/repo"

            chmod a+x "$HOME/bin/repo"
          fi

          echo "$HOME/bin" >> "$GITHUB_PATH"

      # ============================================================
      # TWRP SOURCE
      # ============================================================

      - name: Initialize or update TWRP source
        run: |

          if [ ! -d "twrp/.repo" ]; then

            echo "======================================"
            echo "INICIALIZANDO TWRP"
            echo "======================================"

            mkdir -p twrp
            cd twrp

            repo init \
              --depth=1 \
              -u https://github.com/minimal-manifest-twrp/platform_manifest_twrp_omni.git \
              -b twrp-8.1

          else

            echo "======================================"
            echo "TWRP ENCONTRADO NO CACHE"
            echo "======================================"

            cd twrp

          fi

          repo sync \
            -j4 \
            --force-sync \
            --no-clone-bundle

      # ============================================================
      # DEVICE TREE
      # ============================================================

      - name: Add device tree
        run: |

          DEVICE_DIR="twrp/device/multilaser/ML-JI22-M7SQC_Plus"

          echo "======================================"
          echo "DEVICE TREE"
          echo "======================================"

          if [ ! -d "$DEVICE_DIR" ]; then

            echo "Device tree não encontrado."
            echo "Clonando..."

            mkdir -p twrp/device/multilaser

            git clone \
              -b 'M7SQC_Plus-user-8.1.0-OPM1.171019.026-20210311-release-keys,user/release-keys' \
              https://github.com/twrpdtgen/android_device_multilaser_ML-JI22-M7SQC_Plus.git \
              "$DEVICE_DIR"

          else

            echo "Device tree encontrado."

          fi

          echo
          echo "Conteúdo do device tree:"
          find "$DEVICE_DIR" -maxdepth 2 -type f | sort

      # ============================================================
      # VERIFICAR DEVICE TREE
      # ============================================================

      - name: Verify device tree
        run: |

          DEVICE_DIR="twrp/device/multilaser/ML-JI22-M7SQC_Plus"

          echo "======================================"
          echo "VERIFICAÇÃO DO DEVICE TREE"
          echo "======================================"

          if [ ! -d "$DEVICE_DIR" ]; then
            echo "ERRO: device tree não existe."
            exit 1
          fi

          echo
          echo "AndroidProducts.mk:"
          echo "--------------------------------------"

          if [ -f "$DEVICE_DIR/AndroidProducts.mk" ]; then
            cat "$DEVICE_DIR/AndroidProducts.mk"
          else
            echo "AVISO: AndroidProducts.mk não encontrado."
          fi

          echo
          echo "vendorsetup.sh:"
          echo "--------------------------------------"

          if [ -f "$DEVICE_DIR/vendorsetup.sh" ]; then
            cat "$DEVICE_DIR/vendorsetup.sh"
          else
            echo "AVISO: vendorsetup.sh não encontrado."
          fi

          echo
          echo "Makefiles:"
          echo "--------------------------------------"

          find "$DEVICE_DIR" \
            -maxdepth 1 \
            -type f \
            -name "*.mk" \
            -print

      # ============================================================
      # ROOM SERVICE
      # ============================================================

      - name: Configure roomservice
        run: |

          cd twrp

          echo "======================================"
          echo "CONFIGURANDO ROOMSERVICE"
          echo "======================================"

          export ALLOW_MISSING_DEPENDENCIES=true
          export ROOM_SERVICE_NO_FETCH=true

          if [ -f "vendor/omni/build/tools/roomservice.py" ]; then

            echo "roomservice.py encontrado."

            echo
            echo "Verificando sintaxe..."

            python -m py_compile \
              vendor/omni/build/tools/roomservice.py

          else

            echo "roomservice.py não encontrado."

          fi

      # ============================================================
      # PREPARAR BUILD
      # ============================================================

      - name: Prepare build environment
        run: |

          cd twrp

          export ALLOW_MISSING_DEPENDENCIES=true
          export ROOM_SERVICE_NO_FETCH=true

          source build/envsetup.sh

          echo
          echo "======================================"
          echo "DEVICE TREE FINAL"
          echo "======================================"

          ls -la \
            device/multilaser/ML-JI22-M7SQC_Plus

          echo
          echo "======================================"
          echo "PRODUTOS DISPONÍVEIS"
          echo "======================================"

          lunch 2>&1 | head -100

          echo
          echo "======================================"
          echo "EXECUTANDO LUNCH"
          echo "======================================"

          lunch omni_ML_JI22_M7SQC_Plus-eng

      # ============================================================
      # BUILD
      # ============================================================

      - name: Build TWRP
        run: |

          cd twrp

          export ALLOW_MISSING_DEPENDENCIES=true
          export ROOM_SERVICE_NO_FETCH=true

          source build/envsetup.sh

          echo
          echo "======================================"
          echo "LUNCH"
          echo "======================================"

          lunch omni_ML_JI22_M7SQC_Plus-eng

          echo
          echo "======================================"
          echo "BUILDING RECOVERY"
          echo "======================================"

          mka recoveryimage

      # ============================================================
      # VERIFICAR RESULTADO
      # ============================================================

      - name: Check recovery image
        run: |

          RECOVERY="twrp/out/target/product/ML-JI22-M7SQC_Plus/recovery.img"

          echo "======================================"
          echo "VERIFICANDO RECOVERY"
          echo "======================================"

          echo "Procurando:"
          echo "$RECOVERY"

          if [ ! -f "$RECOVERY" ]; then

            echo
            echo "ERRO: recovery.img não foi criado."

            echo
            echo "Conteúdo do diretório de saída:"

            find \
              twrp/out/target/product \
              -maxdepth 3 \
              -type f \
              2>/dev/null \
              | sort

            exit 1

          fi

          echo
          echo "======================================"
          echo "TWRP GERADO COM SUCESSO"
          echo "======================================"

          ls -lh "$RECOVERY"

          file "$RECOVERY"

      # ============================================================
      # UPLOAD
      # ============================================================

      - name: Upload recovery.img
        uses: actions/upload-artifact@v4
        with:
          name: TWRP-ML-JI22
          path: twrp/out/target/product/ML-JI22-M7SQC_Plus/recovery.img
          if-no-files-found: error