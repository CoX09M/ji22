name: Build TWRP ML-JI22

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:

      # ============================================================
      # CHECKOUT
      # ============================================================

      - name: Checkout
        uses: actions/checkout@v4

      # ============================================================
      # CACHE DO SOURCE
      # ============================================================

      - name: Restore TWRP cache
        id: twrp-cache
        uses: actions/cache@v4
        with:
          path: |
            twrp
            ~/.repoconfig
          key: twrp-8.1-ML-JI22-v1
          restore-keys: |
            twrp-8.1-ML-JI22-

      # ============================================================
      # DEPENDÊNCIAS
      # ============================================================

      - name: Install dependencies
        run: |
          sudo apt update

          sudo apt install -y \
            git-core \
            gnupg \
            flex \
            bison \
            build-essential \
            zip \
            curl \
            zlib1g-dev \
            libc6-dev-i386 \
            lib32ncurses5-dev \
            x11proto-core-dev \
            libx11-dev \
            lib32z1-dev \
            libgl1-mesa-dev \
            libxml2-utils \
            xsltproc \
            unzip \
            fontconfig \
            cpio \
            openjdk-8-jdk

      # ============================================================
      # PYTHON 2
      # ============================================================

      - name: Install Python 2
        run: |
          cd /tmp

          git clone --depth=1 \
            https://github.com/pyenv/pyenv.git \
            pyenv

          export PYENV_ROOT="/tmp/pyenv"
          export PATH="$PYENV_ROOT/bin:$PATH"

          eval "$(pyenv init -)"

          pyenv install -s 2.7.18
          pyenv global 2.7.18

          echo "$PYENV_ROOT/shims" >> "$GITHUB_PATH"

          echo "Python version:"
          python --version

      # ============================================================
      # REPO
      # ============================================================

      - name: Install repo
        run: |
          mkdir -p "$HOME/bin"

          if [ ! -f "$HOME/bin/repo" ]; then
            curl -L \
              https://storage.googleapis.com/git-repo-downloads/repo \
              -o "$HOME/bin/repo"

            chmod a+x "$HOME/bin/repo"
          fi

          echo "$HOME/bin" >> "$GITHUB_PATH"

      # ============================================================
      # TWRP SOURCE
      # ============================================================

      - name: Initialize or update TWRP source
        run: |

          if [ ! -d "twrp/.repo" ]; then

            echo "TWRP não está no cache."
            echo "Inicializando source..."

            mkdir -p twrp

            cd twrp

            repo init \
              --depth=1 \
              -u https://github.com/minimal-manifest-twrp/platform_manifest_twrp_omni.git \
              -b twrp-8.1

          else

            echo "TWRP encontrado no cache."

            cd twrp

          fi

          repo sync \
            -j4 \
            --force-sync \
            --no-clone-bundle

      # ============================================================
      # DEVICE TREE
      # ============================================================

      - name: Add device tree
        run: |

          DEVICE_DIR="twrp/device/multilaser/ML-JI22-M7SQC_Plus"

          if [ ! -d "$DEVICE_DIR/.git" ]; then

            echo "Device tree não encontrado."

            mkdir -p twrp/device/multilaser

            git clone \
              -b 'M7SQC_Plus-user-8.1.0-OPM1.171019.026-20210311-release-keys,user/release-keys' \
              https://github.com/twrpdtgen/android_device_multilaser_ML-JI22-M7SQC_Plus.git \
              "$DEVICE_DIR"

          else

            echo "Device tree encontrado."

          fi

      # ============================================================
      # CORREÇÃO DO NOME DO PRODUTO
      # ============================================================

      - name: Fix product name
        run: |

          cd twrp/device/multilaser/ML-JI22-M7SQC_Plus

          OLD_NAME="omni_ML-JI22-M7SQC_Plus"
          NEW_NAME="omni_ML_JI22_M7SQC_Plus"

          echo "Criando makefile compatível..."

          cp \
            "${OLD_NAME}.mk" \
            "${NEW_NAME}.mk"

          echo "Substituindo nome antigo..."

          grep -RIl \
            "${OLD_NAME}" . \
            | xargs -r sed -i \
            "s/${OLD_NAME}/${NEW_NAME}/g"

          echo
          echo "Verificando referências antigas..."

          if grep -RIn \
            "${OLD_NAME}" .; then

            echo "ERRO: nome antigo ainda existe."

            exit 1

          fi

          echo "OK: nenhuma referência antiga encontrada."

      # ============================================================
      # CORREÇÃO PYTHON LEGADO DO ROOM SERVICE
      # ============================================================

      - name: Fix roomservice Python syntax
        run: |

          cd twrp

          ROOM_SERVICE="vendor/omni/build/tools/roomservice.py"

          echo "Verificando roomservice.py..."

          sed -i \
            's/except IOError, ES.ParseError:/except (IOError, ES.ParseError):/' \
            "$ROOM_SERVICE"

          python -m py_compile \
            "$ROOM_SERVICE"

          echo "roomservice.py OK."

      # ============================================================
      # SALVAR CACHE ANTES DO BUILD
      # ============================================================

      - name: Save source cache
        if: steps.twrp-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            twrp
            ~/.repoconfig
          key: twrp-8.1-ML-JI22-v1

      # ============================================================
      # PREPARAR BUILD
      # ============================================================

      - name: Prepare build environment
        run: |

          cd twrp

          export ALLOW_MISSING_DEPENDENCIES=true

          source build/envsetup.sh

          echo
          echo "======================================"
          echo "Verificando lunch"
          echo "======================================"

          lunch omni_ML_JI22_M7SQC_Plus-eng

      # ============================================================
      # BUILD
      # ============================================================

      - name: Build TWRP
        run: |

          cd twrp

          export ALLOW_MISSING_DEPENDENCIES=true

          source build/envsetup.sh

          lunch omni_ML_JI22_M7SQC_Plus-eng

          echo
          echo "======================================"
          echo "BUILDING RECOVERY"
          echo "======================================"

          mka recoveryimage

      # ============================================================
      # VERIFICAR RESULTADO
      # ============================================================

      - name: Check recovery image
        run: |

          RECOVERY="twrp/out/target/product/ML-JI22-M7SQC_Plus/recovery.img"

          echo "Procurando:"
          echo "$RECOVERY"

          if [ ! -f "$RECOVERY" ]; then

            echo
            echo "ERRO: recovery.img não foi criado."

            echo
            echo "Conteúdo do diretório de saída:"

            find \
              twrp/out/target/product/ML-JI22-M7SQC_Plus \
              -maxdepth 2 \
              -type f \
              2>/dev/null \
              | sort

            exit 1

          fi

          echo
          echo "======================================"
          echo "TWRP GERADO"
          echo "======================================"

          ls -lh "$RECOVERY"

          file "$RECOVERY"

      # ============================================================
      # UPLOAD
      # ============================================================

      - name: Upload recovery.img
        uses: actions/upload-artifact@v4
        with:
          name: TWRP-ML-JI22
          path: twrp/out/target/product/ML-JI22-M7SQC_Plus/recovery.img
          if-no-files-found: error