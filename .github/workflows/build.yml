name: Build TWRP ML-JI22

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y \
            git-core \
            gnupg \
            flex \
            bison \
            build-essential \
            zip \
            curl \
            zlib1g-dev \
            libc6-dev-i386 \
            lib32ncurses5-dev \
            x11proto-core-dev \
            libx11-dev \
            lib32z1-dev \
            libgl1-mesa-dev \
            libxml2-utils \
            xsltproc \
            unzip \
            fontconfig \
            cpio \
            python3 \
            openjdk-8-jdk

      - name: Install repo
        run: |
          mkdir -p "$HOME/bin"
          curl -L https://storage.googleapis.com/git-repo-downloads/repo \
            -o "$HOME/bin/repo"
          chmod a+x "$HOME/bin/repo"
          echo "$HOME/bin" >> "$GITHUB_PATH"

      - name: Initialize TWRP source
        run: |
          mkdir -p twrp
          cd twrp

          repo init --depth=1 \
            -u https://github.com/minimal-manifest-twrp/platform_manifest_twrp_omni.git \
            -b twrp-8.1

          repo sync -j2 --force-sync

      - name: Add device tree
        run: |
          mkdir -p twrp/device/multilaser

          git clone \
            -b 'M7SQC_Plus-user-8.1.0-OPM1.171019.026-20210311-release-keys,user/release-keys' \
            https://github.com/twrpdtgen/android_device_multilaser_ML-JI22-M7SQC_Plus.git \
            twrp/device/multilaser/ML-JI22-M7SQC_Plus

      - name: Fix product name
        run: |
          cd twrp/device/multilaser/ML-JI22-M7SQC_Plus

          cp omni_ML-JI22-M7SQC_Plus.mk \
             omni_ML_JI22_M7SQC_Plus.mk

          sed -i \
            's/omni_ML-JI22-M7SQC_Plus/omni_ML_JI22_M7SQC_Plus/g' \
            omni_ML_JI22_M7SQC_Plus.mk

          sed -i \
            's/omni_ML-JI22-M7SQC_Plus/omni_ML_JI22_M7SQC_Plus/g' \
            AndroidProducts.mk

      - name: Fix old Python syntax
        run: |
          cd twrp

          sed -i \
            's/except IOError, ES.ParseError:/except (IOError, ES.ParseError):/' \
            vendor/omni/build/tools/roomservice.py

      - name: Build TWRP
        run: |
          cd twrp

          export ALLOW_MISSING_DEPENDENCIES=true

          source build/envsetup.sh

          lunch omni_ML_JI22_M7SQC_Plus-eng

          mka recoveryimage

      - name: Check recovery
        run: |
          ls -lh \
            out/target/product/ML-JI22-M7SQC_Plus/recovery.img

          file \
            out/target/product/ML-JI22-M7SQC_Plus/recovery.img

      - name: Upload recovery.img
        uses: actions/upload-artifact@v4
        with:
          name: TWRP-ML-JI22
          path: twrp/out/target/product/ML-JI22-M7SQC_Plus/recovery.img