name: Build TWRP ML-JI22

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y \
            git-core \
            gnupg \
            flex \
            bison \
            build-essential \
            zip \
            curl \
            zlib1g-dev \
            libc6-dev-i386 \
            lib32ncurses5-dev \
            x11proto-core-dev \
            libx11-dev \
            lib32z1-dev \
            libgl1-mesa-dev \
            libxml2-utils \
            xsltproc \
            unzip \
            fontconfig \
            python2 \
            openjdk-8-jdk \
            cpio

      - name: Install repo
        run: |
          mkdir -p $HOME/bin
          curl https://storage.googleapis.com/git-repo-downloads/repo \
            > $HOME/bin/repo
          chmod a+x $HOME/bin/repo
          echo "$HOME/bin" >> $GITHUB_PATH

      - name: Initialize TWRP source
        run: |
          mkdir twrp
          cd twrp
          repo init --depth=1 \
            -u https://github.com/minimal-manifest-twrp/platform_manifest_twrp_omni.git \
            -b twrp-8.1
          repo sync -j2 --force-sync

      - name: Add device tree
        run: |
          mkdir -p twrp/device/multilaser
          git clone \
            -b 'M7SQC_Plus-user-8.1.0-OPM1.171019.026-20210311-release-keys,user/release-keys' \
            https://github.com/twrpdtgen/android_device_multilaser_ML-JI22-M7SQC_Plus.git \
            twrp/device/multilaser/ML-JI22-M7SQC_Plus

      - name: Build TWRP
        run: |
          cd twrp
          export ALLOW_MISSING_DEPENDENCIES=true
          source build/envsetup.sh
          lunch omni_ML-JI22-M7SQC_Plus-eng
          mka recoveryimage

      - name: Upload recovery.img
        uses: actions/upload-artifact@v4
        with:
          name: TWRP-ML-JI22
          path: twrp/out/target/product/ML-JI22-M7SQC_Plus/recovery.img